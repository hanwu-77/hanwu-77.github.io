        <div class="target" aria-hidden="true"><span></span></div>

          <h3 contenteditable="true">我从哪里来</h3>

        <section class="detail-panel" role="dialog" aria-modal="true" aria-labelledby="detail-title">
          <div class="detail-accent" aria-hidden="true"></div>
          <div class="detail-head">
            <div class="detail-index"><span id="detail-number">01</span><i></i></div>
            <button class="detail-close" type="button" aria-label="关闭">×</button>
          </div>
          <h2 id="detail-title"></h2>
          <p class="detail-summary" id="detail-summary"></p>
          <div class="detail-content" id="detail-content"></div>
        </section>

      <template id="module-01-content"><!-- “我是谁”的详细内容以后写在这里。支持任意 HTML。 --></template>
